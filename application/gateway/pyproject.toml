[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway and master orchestrator bridging on-premise and cloud."
requires-python = ">=3.11"
dependencies = [
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
