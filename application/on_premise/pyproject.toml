[project]
name = "on-premise"
version = "0.1.0"
description = "On-premise processing: STT, SLM structuring, and anonymization."
requires-python = ">=3.11"
dependencies = [
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/on_premise"]
