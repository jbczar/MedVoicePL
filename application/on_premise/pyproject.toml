[project]
name = "on-premise"
version = "0.1.0"
description = "On-premise processing: STT, SLM structuring, and anonymization."
requires-python = ">=3.11"
dependencies = [
    "shared",
    # Phase 2a — STT + diarization
    "faster-whisper>=1.0",      # CPU/CUDA fallback, portable
    "mlx-whisper>=0.4",         # Apple Silicon primary (also in [apple] extra)
    "pyannote.audio>=3.1",      # 2-speaker diarization
    "torch>=2.2",               # pyannote runtime
    "torchaudio>=2.2",          # WAV loading for pyannote
    "numpy>=1.26",
    "soundfile>=0.12",          # WAV I/O for vad.py + tests
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # Phase 2b — SLM structuring
    "mlx-lm>=0.19",                 # Apple Silicon primary for Bielik / PLLuM
    "lm-format-enforcer>=0.10",     # grammar-constrained JSON decoding (both backends)
]

[project.optional-dependencies]
apple = ["mlx-whisper>=0.4", "mlx-lm>=0.19"]    # Apple Silicon speed-up; Linux/CI can drop it
portable = ["llama-cpp-python>=0.2.90,<0.3"]    # GGUF fallback; compiles from source (~3-5 min on M5)

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/on_premise"]
