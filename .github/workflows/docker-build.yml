name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "application/**"
      - "dataset_pipeline/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: on-premise, context: application/on_premise, dockerfile: application/on_premise/Dockerfile }
          - { name: cloud, context: application/cloud, dockerfile: application/cloud/Dockerfile }
          - { name: gateway, context: application/gateway, dockerfile: application/gateway/Dockerfile }
          - { name: frontend, context: application/frontend, dockerfile: application/frontend/Dockerfile }
          - { name: dataset-pipeline, context: dataset_pipeline, dockerfile: dataset_pipeline/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          dockerfile: ${{ matrix.service.dockerfile }}
          push: false
          tags: medvoicepl/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max