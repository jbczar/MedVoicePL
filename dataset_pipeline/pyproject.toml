[project]
name = "dataset-pipeline"
version = "0.1.0"
description = "Synthetic Polish medical visit dataset generation pipeline."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_pipeline"]
