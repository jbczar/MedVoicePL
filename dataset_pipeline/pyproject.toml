[project]
name = "dataset-pipeline"
version = "0.1.0"
description = "Synthetic Polish medical visit dataset generation pipeline."
requires-python = ">=3.11"
dependencies = [
    # Phase 1a — scenario generation
    "google-genai>=0.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    # Phase 1b — TTS + audio postprocessing
    "coqui-tts>=0.27",      # community XTTSv2 fork (original Coqui is archived)
    "transformers>=4.40,<5.1",  # coqui-tts uses isin_mps_friendly removed in 5.1+
    "torch>=2.2",           # coqui-tts runtime + resampling
    "torchaudio>=2.2",      # resampling kernels
    "torchcodec>=0.11",     # torchaudio MP3 backend
    "soundfile>=0.12",      # WAV I/O without ffmpeg dep
    "numpy>=1.26",
    "requests>=2.31",       # reference-voice fetch script
    "tqdm>=4.66",           # progress for downloads
    # Phase 1b.1 — noise injection + augmentations
    "pedalboard>=0.9",      # Spotify's audio FX (reverb, pitch shift, time stretch)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_pipeline"]
