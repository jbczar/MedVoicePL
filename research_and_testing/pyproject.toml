[project]
name = "research-and-testing"
version = "0.1.0"
description = "Evaluation benchmarks and testing for the MedVoicePL CDSS."
requires-python = ">=3.11"
dependencies = [
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]
