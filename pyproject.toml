[project]
name = "medvoicepl"
version = "0.1.0"
description = "Multimodal multi-agent clinical decision support system for Polish medical visits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.1",
]

[tool.uv.workspace]
members = [
    "dataset_pipeline",
    "application/on_premise",
    "application/cloud",
    "application/gateway",
    "application/shared",
    "research_and_testing",
]

[tool.uv.sources]
shared = { workspace = true }

# ---------------------------------------------------------------------------
# Linting — ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "dataset_pipeline/src",
    "application/on_premise/src",
    "application/cloud/src",
    "application/gateway/src",
    "application/shared/src",
    "research_and_testing",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"**/scripts/*.py" = ["B008"]  # Typer idiom: Option() in argument defaults
"**/tests/**/*.py" = ["TC001", "TC002", "TC003"]  # tests import types at runtime
# Phase 3a — Typer CLI lives under data/ rather than scripts/.
"**/data/nfz_formulary/ingest_nfz.py" = ["B008"]
# Polish prompt strings use EN DASH intentionally for numeric ranges (1–2, 2–3).
"**/structuring/prompts.py" = ["RUF001"]
# Phase 3a — cloud modules use Pydantic + LangGraph with runtime annotations
# (LangGraph reads `AgentState` TypedDict at runtime; orchestrator nodes
# inspect `NFZIndex` / `ChPLChain` types). Move-to-type-checking-block
# would break runtime introspection. EN DASH "—" appears in Polish
# drug docstrings ("propranolol — beta-blocker") — RUF001/002 ignored.
"**/cloud/orchestrator.py" = ["RUF001", "RUF002", "TC001", "TC002", "TC003"]
"**/cloud/rag/retriever.py" = ["RUF002", "TC003"]
"**/cloud/llm_integration/llm_client.py" = ["TC002"]
"**/cloud/llm_integration/prompts.py" = ["RUF001", "TC001"]
"**/cloud/data/nfz_formulary/ingest_nfz.py" = ["B008", "TC003"]
"**/cloud/data/nfz_formulary/build_atc_map.py" = ["B008", "F541"]
# Phase 2c.1 — eponym filter strips multiple Unicode apostrophe variants
# from medical names ("Whipple'a", "Reye'a"); each variant is intentional.
"**/anonymization/eponym_filter.py" = ["RUF001", "TC002"]
"**/tests/test_eponym_filter.py" = ["RUF001"]
# Phase 2a.1: Transcript types are runtime-evaluated (Pydantic dataclass);
# tests use `pytest.raises(Exception)` for ValidationError edge cases.
"**/stt/speaker_classifier.py" = ["TC001", "RUF002", "RUF003"]
"**/tests/test_speaker_classifier.py" = ["B017"]
"**/cloud/nfz/atc_resolver.py" = ["TC003"]
"**/cloud/nfz/formulary_search.py" = ["TC003"]
"**/cloud/rag/chain.py" = ["TC003"]
# Phase 2c trust gate: en-dash in docstrings (range "100–500 ms"),
# long-s in regex char class (Latin Extended-A range), and the
# `Violation` exception name is intentional (semantic over PEP-conventional).
"**/trust_gate.py" = ["RUF001", "RUF002", "RUF003", "N818"]
# Phase 2c FastAPI app: `UUID`/`date`/`AsyncIterator` are imported at
# runtime because FastAPI's parameter validation reads runtime
# annotations; TC003 doesn't apply. `Query(...)` in defaults is the
# canonical FastAPI idiom (B008 same as Typer's `Option(...)`).
"**/api/app.py" = ["TC003", "B008"]
# Gateway routers + orchestrator + clients all use Annotated[X, Depends(...)]
# / Pydantic-validated bodies, where the parameter types must be available
# at runtime. Same FastAPI/Pydantic exemption as `**/api/app.py`.
"application/gateway/src/**/*.py" = ["TC001", "TC002", "TC003", "B008"]
"application/gateway/tests/**/*.py" = ["RUF003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = [
    "dataset_pipeline",
    "on_premise",
    "cloud",
    "gateway",
    "shared",
    "research_and_testing",
]

# ---------------------------------------------------------------------------
# Type checking — mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # relaxed for initial development
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]

# ---------------------------------------------------------------------------
# Testing — pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "dataset_pipeline/tests",
    "application/on_premise/tests",
    "application/cloud/tests",
    "application/gateway/tests",
    "application/shared/tests",
    "research_and_testing",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"
